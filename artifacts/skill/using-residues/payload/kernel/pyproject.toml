# The kernel, packaged. Installing it is optional: `bin/residual` runs the same
# code straight from this directory, which is what the skills do by default.
#
# Zero dependencies, and that is a design constraint rather than a happy
# accident -- a skill you fetch has to run on whatever Python is already there.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residual"
version = "0.2.0"
description = "Harness-agnostic kernel for running Residuality Theory analyses with agents"
readme = "README.md"
requires-python = ">=3.11"        # tomllib
license = { text = "MIT" }
keywords = ["residuality", "architecture", "agents", "skills"]
dependencies = []                  # and it stays that way

[project.scripts]
residual = "residual.cli:main"

[tool.setuptools]
packages = ["residual", "residual.render"]

[tool.setuptools.package-data]
residual = ["data/*.toml"]
